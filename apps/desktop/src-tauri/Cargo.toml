[package]
name = "yuika-desktop"
version = "0.1.0"
description = "Yuika desktop shell (Tauri 2)"
edition = "2021"

# P2-DTL-1 (D47): shell Tauri reuse UI web + onboarding host/remote.
# - HOST  : shell spawn API lokal (dev: npm run dev -w @yuika/api di
#   checkout studio via YUIKA_STUDIO_DIR/sibling), tunggu
#   health, lalu navigasi window ke UI web (dev: http://localhost:3000).
# - REMOTE: user isi URL host lain (web-host di mesin lain) → window navigasi.
# Packaging NSIS + auto-update (P2-DTL-3) menyusul (lihat docs/PLAN-DESKTOP.md).

[lib]
name = "yuika_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Auto-update (P2-DTL-3/D49): updater = cek+unduh+pasang (NSIS passive),
# process = relaunch setelah install. Endpoint: GitHub releases latest.json.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
